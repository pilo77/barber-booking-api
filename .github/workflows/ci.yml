name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  maven-verify:
    name: Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Show Docker info
        run: docker info

      - name: Run Maven verify
        run: ./mvnw -B verify

      - name: Check whitespace errors
        run: git diff --check
