spring:
  application:
    name: barber-booking-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/barber_booking}
    username: ${SPRING_DATASOURCE_USERNAME:barber_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}

booking:
  slot-step-minutes: ${BOOKING_SLOT_STEP_MINUTES:15}
  public:
    idempotency:
      in-progress-ttl: ${PUBLIC_BOOKING_IDEMPOTENCY_IN_PROGRESS_TTL:2m}
    rate-limit:
      ip-max-attempts: ${PUBLIC_BOOKING_RATE_LIMIT_IP_MAX_ATTEMPTS:10}
      ip-window: ${PUBLIC_BOOKING_RATE_LIMIT_IP_WINDOW:1m}
      phone-max-attempts: ${PUBLIC_BOOKING_RATE_LIMIT_PHONE_MAX_ATTEMPTS:3}
      phone-window: ${PUBLIC_BOOKING_RATE_LIMIT_PHONE_WINDOW:10m}

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:60}
  bootstrap:
    token: ${APP_BOOTSTRAP_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
